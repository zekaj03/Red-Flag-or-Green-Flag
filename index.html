<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Flag • Green Flag</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🚩 Red Flag • 🌀 Green Flag</h1>
        <p class="subtitle">Deine schnelle Entscheidungshilfe</p>
        
        <div class="examples">
            <p>Beispiele (klicken):</p>
            <button onclick="loadExample(0)">Partner ignoriert mich</button>
            <button onclick="loadExample(1)">Neuer Job mit gutem Team</button>
            <button onclick="loadExample(2)">Viele Schulden & Stress</button>
            <button onclick="loadExample(3)">Offene Kommunikation & Sport</button>
        </div>

        <div class="input-section">
            <textarea id="scenario" placeholder="Beschreibe dein Szenario..." rows="4"></textarea>
            <button onclick="analyzeFlags()">🔍 Analysieren</button>
        </div>
        
        <div id="result" class="result">
            <div class="flags">
                <div class="flag red">
                    <h2>🚩 Red Flags</h2>
                    <ul id="red-flags"></ul>
                </div>
                <div class="flag green">
                    <h2>🌀 Green Flags</h2>
                    <ul id="green-flags"></ul>
                </div>
            </div>
            <div class="verdict">
                <h3>Verdikt: <span id="verdict"></span></h3>
            </div>
            <button onclick="resetApp()">Neu starten</button>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        function loadExample(n) {
            const examples = [
                'Mein Partner ignoriert meine Nachrichten seit 3 Tagen und lügt oft',
                'Neuer Job mit gutem Team, Wachstum und Work-Life-Balance',
                'Viele Schulden durch Überstunden und hoher Stress',
                'Offene Kommunikation, regelmäßig Sport und stabile Finanzen'
            ];
            document.getElementById('scenario').value = examples[n];
            analyzeFlags();
        }
    </script>
</body>
</html>
